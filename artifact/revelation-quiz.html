<title>수료 종합 시험 퀴즈</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=Nanum+Pen+Script&display=swap">
<style>
/* Layout: one exam sheet at a time — question in ink, answer revealed in red pen, a ruled-paper card centered on a cool desk. */
:root {
  --desk: #e9edf3;
  --paper: #fbfcfe;
  --rule: #d5dde9;
  --ink: #1e2a44;
  --ink-soft: #5a6680;
  --pen: #d0312d;
  --pen-soft: #fbe4e2;
  --ok: #1f7a4d;
  --ok-soft: #dcf1e5;
  --line: #c3cddd;
  --f-display: "Gowun Batang", "Noto Serif KR", "AppleMyungjo", serif;
  --f-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-pen: "Nanum Pen Script", "Gowun Batang", cursive;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --desk: #11151d; --paper: #1a202b; --rule: #283142; --ink: #e4e9f2; --ink-soft: #97a3b8;
    --pen: #ff6b63; --pen-soft: #3a2224; --ok: #5fcf95; --ok-soft: #1c3329; --line: #36415a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --desk: #11151d; --paper: #1a202b; --rule: #283142; --ink: #e4e9f2; --ink-soft: #97a3b8;
  --pen: #ff6b63; --pen-soft: #3a2224; --ok: #5fcf95; --ok-soft: #1c3329; --line: #36415a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--desk); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 40px;
}
.wrap { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
header { display: flex; flex-direction: column; gap: 4px; }
.verse { font-size: 12px; color: var(--ink-soft); letter-spacing: .02em; }
h1 { font-family: var(--f-display); font-weight: 700; font-size: clamp(24px, 5vw, 32px); margin: 0; line-height: 1.25; text-wrap: balance; }
h1 .omega { color: var(--pen); font-weight: 400; }

.controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
select, .chk { font: 500 14px var(--f-body); color: var(--ink); background: var(--paper); border: 1px solid var(--line); border-radius: 999px; padding: 7px 12px; }
.chk { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
.chk input { accent-color: var(--pen); margin: 0; }
button:focus-visible, select:focus-visible, textarea:focus-visible, .chk:focus-within { outline: 2px solid var(--pen); outline-offset: 2px; }

.status { display: flex; gap: 14px; align-items: center; font-size: 13px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.bar { flex: 1; height: 6px; background: var(--rule); border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--pen); width: 0; transition: width .3s; }
.status b { color: var(--ink); font-weight: 600; }

.sheet {
  background: var(--paper);
  background-image: repeating-linear-gradient(to bottom, transparent 0 35px, var(--rule) 35px 36px);
  background-position: 0 14px;
  border: 1px solid var(--line); border-radius: 6px;
  box-shadow: 0 1px 0 var(--line), 0 10px 30px -18px rgba(20, 30, 60, .35);
  padding: 22px clamp(16px, 4vw, 34px) 26px;
  display: flex; flex-direction: column; gap: 18px; min-width: 0;
}
.qhead { display: flex; gap: 10px; align-items: baseline; }
.qnum { font-family: var(--f-display); font-weight: 700; font-size: 22px; color: var(--pen); font-variant-numeric: tabular-nums; flex: none; }
.qtext { font-family: var(--f-display); font-size: 18px; line-height: 1.75; min-width: 0; }
.ask { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.ask .label { font-weight: 600; font-size: 13px; letter-spacing: .04em; color: var(--paper); background: var(--ink); padding: 3px 10px; border-radius: 4px; }
.ask .prompt { font-weight: 600; font-size: 17px; }


textarea {
  width: 100%; min-height: 88px; resize: vertical; font: 400 16px/1.6 var(--f-body); color: var(--ink);
  background: var(--paper); border: 1px dashed var(--line); border-radius: 8px; padding: 10px 12px;
}
.verdict { display: flex; gap: 14px; align-items: center; border-top: 1px dashed var(--line); padding-top: 14px; }
.verdict .mark { font-family: var(--f-display); font-size: 44px; line-height: 1; font-weight: 700; }
.verdict b { font-size: 18px; }
.verdict.is-ok .mark, .verdict.is-ok b { color: var(--ok); }
.verdict.is-no .mark, .verdict.is-no b { color: var(--pen); }
.meter { font-size: 13px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.keys { display: flex; flex-wrap: wrap; gap: 6px; }
.key { font-size: 13.5px; padding: 2px 10px; border-radius: 999px; border: 1px solid; }
.key.hit { color: var(--ok); background: var(--ok-soft); border-color: transparent; }
.key.miss { color: var(--pen); border-color: var(--pen); border-style: dashed; }
textarea[readonly] { border-style: solid; color: var(--ink-soft); }
.answer { display: flex; gap: 10px; align-items: baseline; border-top: 1px dashed var(--line); padding-top: 14px; }
.answer .tag { font-weight: 600; font-size: 14px; color: var(--ink-soft); flex: none; }
.answer .pen { font-family: var(--f-pen); color: var(--pen); font-size: 27px; line-height: 1.3; min-width: 0; overflow-wrap: anywhere; white-space: pre-line; }

.actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
.btn { font: 600 15px var(--f-body); border-radius: 999px; padding: 10px 20px; cursor: pointer; border: 1px solid var(--ink); background: var(--ink); color: var(--paper); }
.btn.ghost { background: transparent; color: var(--ink); }
.btn.ok { background: var(--ok); border-color: var(--ok); }
.btn.no { background: var(--pen); border-color: var(--pen); }
.hint { font-size: 12px; color: var(--ink-soft); text-align: right; }

.result { text-align: center; display: flex; flex-direction: column; gap: 10px; align-items: center; }
.score { font-family: var(--f-display); font-size: 64px; font-weight: 700; line-height: 1; color: var(--pen); font-variant-numeric: tabular-nums; }
.score small { font-size: 22px; color: var(--ink-soft); }
.grade { font-family: var(--f-pen); font-size: 34px; color: var(--pen); transform: rotate(-4deg); }
.misses { list-style: none; padding: 0; margin: 6px 0 0; display: grid; gap: 10px; text-align: left; width: 100%; }
.misses li { border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; background: var(--paper); }
.misses .m-q { font-size: 13px; color: var(--ink-soft); }
.misses .m-a { font-family: var(--f-pen); color: var(--pen); font-size: 23px; line-height: 1.3; white-space: pre-line; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <header>
    <div class="verse">✝ 이 예언의 말씀을 읽는 자와 듣는 자들과 그 가운데 기록한 것을 지키는 자들이 복이 있나니 때가 가까움이라 (계 1:3)</div>
    <h1>시온기독교선교센터 수료 종합 시험 <span class="omega">퀴즈</span></h1>
  </header>

  <div class="controls">
    <select id="range" aria-label="문항 범위">
      <option value="all">전체 40문항</option>
      <option value="1-10">1–10번</option>
      <option value="11-20">11–20번</option>
      <option value="21-30">21–30번</option>
      <option value="31-40">31–40번</option>
      <option value="miss">지난번 틀린 것만</option>
    </select>
    <label class="chk"><input type="checkbox" id="shuffle"> 섞기</label>
  </div>

  <div class="status">
    <span id="pos">1 / 100</span>
    <div class="bar"><i id="barfill"></i></div>
    <span>정답 <b id="right">0</b></span>
    <span>연속 <b id="streak">0</b></span>
  </div>

  <main class="sheet" id="sheet" aria-live="polite"></main>
  <div class="hint" id="hint">Ctrl+Enter 채점 · Enter 다음 문제 · 핵심어의 70% 이상을 쓰면 정답</div>
</div>

<script>
const Q = [
 [1,"나는 성경이 말씀한 누구인지, 관련 성경 장과 함께 쓰시오.",[["","나는 누구인가","나는 계시록 성취 때 하나님의 씨로 나서 추수되고 인 맞아 계 7장의 12지파에 소속된 계 14장의 첫 열매의 실체이다."]]],
 [2,"내가 참으로 이 성경대로 창조되었다는 증거는 무엇인가?",[["","창조된 증거","추수되고 인 맞아 계 7장의 12지파에 소속된 것"]]],
 [3,"성경에는 생명나무와 선악을 알게 하는 나무가 있다. 오늘날 ①생명나무 과실과 ②선악나무 과실은 무엇인지 각각 쓰시오.",[["①","생명나무 과실","계시록의 실상의 말씀"],["②","선악나무 과실","거짓 목자의 거짓 교리(주석)"]]],
 [4,"하나님이 주시는 두 가지의 계시는 ①무엇이고, 그중 계시록 성취 때 하나님의 종들이 받아야 할 계시는 ②무엇이며, 이 계시가 ③전달되는 과정을 쓰시오.",[["①","두 가지의 계시","예언적 환상 계시, 실상 계시"],["②","종들이 받아야 할 계시","실상 계시"],["③","계시가 전달되는 과정","하나님 → 예수님 → 천사 → 새요한 → 종들"]]],
 [5,"계 1:3에 ①'읽는 자'와 ②'듣는 자들'과 ③'지키는 자들'은 누구인지 각각 계시록의 해당 장(성구)과 함께 쓰시오.",[["①","읽는 자","열린 책을 받아먹은 새요한, 계 10장"],["②","듣는 자들","새요한에게 배우는 백성, 나라, 방언, 임금, 계 10:11"],["③","지키는 자들","새요한을 포함한 12지파 144,000과 흰 무리, 계 7장"]]],
 [6,"계시록 성취는 ①누구의 출현으로 시작되는지 관련 성구와 함께 쓰고, 계시록이 성취되기 시작한 이 일은 ②언제, ③어디에서 실상으로 이루어졌는지 쓰시오.",[["①","누구의 출현 (성구)","재림 예수님, 계 1, 2, 3장"],["②","언제","1966년"],["③","어디에서","과천 소재 청계산 하(下) 장막성전"]]],
 [7,"계 2~3장에 보낸 편지 내용은 ①몇 가지 무엇이며, 계 2~3장의 출현 인물 ②세 존재를 순차적으로 쓰고, 그들이 각자 ③한 일을 쓰시오.",[["①","편지 내용 몇 가지 무엇","세 가지: 본 것, 이제 있는 일, 장차 될 일"],["②","출현 인물 세 존재 (순서대로)","일곱 사자, 니골라당, 요한"],["③","그들이 각자 한 일","일곱 사자: 길 예비 등불 역사\n니골라당: 우상의 제물과 교훈, 행음\n요한: 회개할 것과 약속의 말씀 편지"]]],
 [8,"계시록의 3가지 비밀은 무엇인지 성구와 함께 기록하시오.",[["①","첫째 비밀","일곱 별과 일곱 금 촛대의 비밀, 계 1:20"],["②","둘째 비밀","음녀 바벨론과 일곱 머리와 열 뿔 가진 짐승의 비밀, 계 17:5~7"],["③","셋째 비밀","마지막 일곱째 나팔의 비밀, 계 10:7"]]],
 [9,"이기는 자에게 주겠다고 계 2~3장에 약속한 ①복을 쓰고, 이것 외에 이기는 자가 받는 ②또 1가지 복을 증거 성구와 함께 쓰시오.",[["①","계 2~3장에 약속한 복","생명나무 과실, 생명의 면류관, 둘째 사망의 해를 면함, 감추었던 만나, 흰 돌, 철장, 새벽별, 흰옷 입음, 생명책 녹명, 하나님 성전의 기둥, 하나님과 거룩한 성 새 예루살렘의 이름과 예수님의 새 이름 기록, 예수님의 보좌에 앉게 해 줌"],["②","또 1가지 복 (성구)","유업을 받는 아들이 됨, 계 21:7"]]],
 [10,"'하나님의 이름과 거룩한 성 새 예루살렘의 이름과 예수님의 새 이름을 이기는 자 위에 기록해 주겠다'는 것의 의미는 ①무엇이며, 예수님이 계 2~3장에 약속하신 복은 ②누가 받게 되는가?",[["①","이름을 기록해 주겠다는 의미","하나님과 천국과 예수님이 이긴자에게 오심"],["②","복을 받는 자","사단 니골라당과 싸워 이기는 자"]]],
 [11,"계 4:8에서 하나님의 보좌가 장차 이 땅에 임해 오신다고 했다. 하나님의 보좌는 계시록 ①몇 장의 어디에 오시며, 그곳의 실체는 ②어디인가?",[["①","몇 장의 어디","계 14장의 12지파 인 맞은 144,000이 있는 시온산"],["②","그곳의 실체","신천지예수교 증거장막성전"]]],
 [12,"계 5장에서 하나님의 오른손에 있는 '일곱 인으로 봉한 책'은 요한계시록이다. 그동안 봉한 책의 내용을 천상천하 아무도 몰랐던 이유는 ①무엇이고, 봉한 책의 내용은 ②무엇인가?",[["①","아무도 몰랐던 이유","실상이 나타나지 않았기 때문"],["②","봉한 책의 내용","이루어야 할 하나님의 비밀"]]],
 [13,"눅 22:14~20에 새 언약으로 약속하신 '예수님의 피와 살'은 ①언제, ②어디에서, ③누가 먹게 되는지 증거 성구 3개와 함께 쓰시오.",[["①","언제","계시록 성취 때"],["②","어디에서","하나님의 나라 계 7장의 신천지 12지파"],["③","누가 (성구 3개)","144,000과 흰 무리, 계 1:5~6, 계 5:9~10, 계 7:9~14"]]],
 [14,"계 6장은 ①누가, 누구를 들어, ②누구를 심판한 것이며, 계 6장에서 쫓겨난 자들은 ③몇 장, 몇 장에서 죽임을 당하는가?",[["①","누가, 누구를 들어","예수님, 네 생물"],["②","누구를 심판","배도한 선민(일곱 사자와 장막 성도들)"],["③","죽임을 당하는 장","계 8장, 계 9장"]]],
 [15,"마 8장의 바깥 어두운 데로 쫓겨나는 ①'나라의 본 자손들'과 ②'동서로부터 와서 천국에 앉는 자들'은 누구인지 각각 관련 성경 장과 함께 쓰시오.",[["①","나라의 본 자손들","부패한 전통 교회(영적 이스라엘), 계 6장(계 13장)"],["②","동서로부터 와서 천국에 앉는 자들","추수되어 인 맞은 신천지 12지파(영적 새 이스라엘), 계 7장(계 14장)"]]],
 [16,"계 7장의 인 맞은 자들은 ①무슨 일 후, ②어디서 어떻게 온 자들이며, 이들의 실체는 ③누구인가?",[["①","무슨 일 후","계 6장의 배도한 선천 해·달·별에 대한 심판 후"],["②","어디서 어떻게","추수 밭에서 추수되어"],["③","이들의 실체","신천지 12지파 144,000"]]],

// Flatten to cards
const CARDS = [];
Q.forEach(([n, q, subs]) => subs.forEach(([l, p, a], i) => CARDS.push({ id: n + "-" + i, n, q, l, p, a })));

const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};

const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const shuffleArr = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
let S = null;

// ---------- 자동 채점 ----------
// 정답을 핵심어로 쪼갠 뒤, 입력한 답에 각 핵심어가 들어 있는지 확인한다.
const STOP = new Set(["것", "때", "곧", "및", "등", "그", "더", "때문", "계", "장", "할", "있는", "된", "한", "되는", "하는"]);
const SUFFIX = ["에서", "으로", "부터", "까지", "들의", "들과", "들은", "들을", "들이", "들", "의", "과", "와", "을", "를", "은", "는", "에", "로", "도", "이", "가"];
const norm = s => s.replace(/[-–—]/g, "~").replace(/[\s.,·:;'"‘’“”()（）\[\]<>→\/]/g, "").toLowerCase();

function keywords(answer) {
  const out = [];
  answer
    .replace(/(계|마|눅|겔|수|고전)\s?(\d+:\d+(?:~\d+)?)/g, "$2")       // "계 10:11" → "10:11"
    .split(/[\s,\n·()→:]+(?![\d])|[\s,\n·()→]+/)
    .forEach(raw => {
      let t = raw.replace(/[.'"‘’“”]/g, "").trim();
      if (!t) return;
      if (/\d/.test(t)) {                                              // 숫자·성구: 숫자 부분만 정확히
        t = t.replace(/[^\d:~,]/g, "").replace(/-/g, "~");
        if (t) out.push({ t: raw.trim(), stem: norm(t), num: true });
        return;
      }
      if (STOP.has(t)) return;
      let base = t;
      for (const sfx of SUFFIX) {
        const keep = (sfx === "들" || sfx === "의") ? 1 : 2;            // "종들" → "종", "국가"는 그대로
        if (base.length >= sfx.length + keep && base.endsWith(sfx)) { base = base.slice(0, -sfx.length); break; }
      }
      if (STOP.has(base)) return;
      const L = base.length;
      const stem = L >= 4 ? base.slice(0, L - 2)
        : L === 3 ? base.slice(0, 2)
        : L === 2 && "지고아어게며서".includes(base[1]) ? base[0]            // "받지" → "받", "맞아" → "맞"
        : base;
      out.push({ t: raw.trim(), stem: norm(stem), num: false });
    });
  const seen = new Set();
  return out.filter(k => k.stem && !seen.has(k.stem) && seen.add(k.stem));
}

function autoGrade(answer, input) {
  const keys = keywords(answer);
  const u = norm(input);
  const hits = keys.map(k => ({ t: k.t, hit: u.length > 0 && u.includes(k.stem) }));
  const n = hits.filter(h => h.hit).length;
  const pct = keys.length ? Math.round(n / keys.length * 100) : 0;
  return { hits, pct, ok: pct >= 70 };
}

function buildDeck() {
  const r = $("range").value;
  let deck = CARDS;
  if (r === "miss") {
    const miss = new Set(store.get("rq-miss", []));
    deck = CARDS.filter(c => miss.has(c.id));
  } else if (r !== "all") {
    const [lo, hi] = r.split("-").map(Number);
    deck = CARDS.filter(c => c.n >= lo && c.n <= hi);
  }
  if ($("shuffle").checked) deck = shuffleArr(deck);
  return deck.map(c => c.id);
}

function start(data) {
  if (data && data.S && data.S.deck && "graded" in data.S && data.S.deck.every(id => CARDS.some(c => c.id === id))) { S = data.S; render(); return; }
  newGame();
}
function newGame(deckIds) {
  const deck = deckIds || buildDeck();
  S = { deck, i: 0, right: 0, streak: 0, best: 0, misses: [], graded: null, draft: "" };
  render();
}

function cardAt(i) { const id = S.deck[i]; return CARDS.find(c => c.id === id); }

function markQuestion(q, label) {
  if (!label) return esc(q);
  return esc(q).replace(label, `<mark style="background:var(--pen-soft);color:var(--pen);font-weight:700;padding:0 2px;border-radius:3px">${label}</mark>`);
}

function renderStatus() {
  const total = S.deck.length;
  const done = Math.min(S.i + (S.graded ? 1 : 0), total);
  $("pos").textContent = total ? `${Math.min(S.i + 1, total)} / ${total}` : "0 / 0";
  $("barfill").style.width = total ? (done / total * 100) + "%" : "0";
  $("right").textContent = S.right;
  $("streak").textContent = S.streak;
}

function render() {
  renderStatus();
  const sheet = $("sheet");
  if (!S.deck.length) {
    sheet.innerHTML = `<div class="result"><div class="grade">틀린 문제가 없습니다</div><p>지난번에 틀린 문항이 저장되어 있지 않아요. 다른 범위를 골라 풀어 보세요.</p></div>`;
    $("hint").hidden = true;
    return;
  }
  if (S.i >= S.deck.length) return renderResult();
  $("hint").hidden = false;
  const c = cardAt(S.i);
  const g = S.graded;
  let html = `
    <div class="qhead"><span class="qnum">${c.n}.</span><div class="qtext">${markQuestion(c.q, c.l)}</div></div>
    <div class="ask"><span class="label">${c.l ? "문항 " + c.l : "답"}</span><span class="prompt">${esc(c.p)}</span></div>
    <textarea id="draft" placeholder="답을 적고 채점하기를 누르세요" ${g ? "readonly" : ""}>${esc(S.draft)}</textarea>`;
  if (g) {
    html += `
      <div class="verdict ${g.ok ? "is-ok" : "is-no"}">
        <span class="mark">${g.ok ? "○" : "✕"}</span>
        <div><b>${g.ok ? "정답" : "오답"}</b>${g.overridden ? " (정답으로 인정)" : ""}<div class="meter">핵심어 ${g.hits.filter(h => h.hit).length} / ${g.hits.length} 일치 · ${g.pct}%</div></div>
      </div>
      <div class="keys">${g.hits.map(h => `<span class="key ${h.hit ? "hit" : "miss"}">${esc(h.t)}</span>`).join("")}</div>
      <div class="answer"><span class="tag">답&gt;</span><span class="pen">${esc(c.a)}</span></div>
      <div class="actions">
        ${!g.ok ? `<button class="btn ghost" id="accept">정답으로 인정</button>` : ""}
        <button class="btn" id="next">${S.i + 1 < S.deck.length ? "다음 문제" : "결과 보기"}</button>
      </div>`;
  } else {
    html += `<div class="actions"><button class="btn ghost" id="skip">모르겠어요</button><button class="btn" id="check">채점하기</button></div>`;
  }
  sheet.innerHTML = html;
  const d = $("draft");
  d.oninput = () => { S.draft = d.value; };
  const ck = $("check"); if (ck) ck.onclick = check;
  const sk = $("skip"); if (sk) sk.onclick = () => { S.draft = ""; check(); };
  const ac = $("accept"); if (ac) ac.onclick = accept;
  const nx = $("next"); if (nx) { nx.onclick = next; nx.focus({ preventScroll: true }); }
  else d.focus({ preventScroll: true });
}

function check() {
  if (S.graded) return;
  const c = cardAt(S.i);
  S.graded = autoGrade(c.a, S.draft);
  if (S.graded.ok) { S.right++; S.streak++; S.best = Math.max(S.best, S.streak); }
  else { S.streak = 0; S.misses.push(c.id); }
  render();
}
function accept() {
  const c = cardAt(S.i);
  S.graded.ok = true; S.graded.overridden = true;
  S.misses = S.misses.filter(id => id !== c.id);
  S.right++; S.streak++; S.best = Math.max(S.best, S.streak);
  render();
}
function next() {
  S.i++; S.graded = null; S.draft = "";
  if (S.i >= S.deck.length) saveMisses();
  render();
  window.scrollTo({ top: 0, behavior: "smooth" });
}
function saveMisses() {
  const prev = new Set(store.get("rq-miss", []));
  S.deck.forEach(id => prev.delete(id));
  S.misses.forEach(id => prev.add(id));
  store.set("rq-miss", [...prev]);
}

function renderResult() {
  $("hint").hidden = true;
  const total = S.deck.length, pct = Math.round(S.right / total * 100);
  const grade = pct === 100 ? "만점!" : pct >= 90 ? "아주 잘했어요" : pct >= 70 ? "조금만 더" : "다시 한 번";
  const misses = S.misses.map(id => CARDS.find(c => c.id === id));
  $("sheet").innerHTML = `
    <div class="result">
      <div class="grade">${grade}</div>
      <div class="score">${S.right}<small> / ${total}</small></div>
      <div style="color:var(--ink-soft);font-size:14px">정답률 ${pct}% · 최고 연속 ${S.best}문항</div>
      <div class="actions" style="justify-content:center">
        ${misses.length ? `<button class="btn no" id="retry">틀린 ${misses.length}문항 다시 풀기</button>` : ""}
        <button class="btn ghost" id="again">처음부터 다시</button>
      </div>
      ${misses.length ? `<ul class="misses">${misses.map(c => `<li><div class="m-q">${c.n}번 ${c.l} · ${esc(c.p)}</div><div class="m-a">${esc(c.a)}</div></li>`).join("")}</ul>` : ""}
    </div>`;
  const r = $("retry"); if (r) r.onclick = () => newGame(shuffleArr(S.misses));
  $("again").onclick = () => newGame();
}

$("range").onchange = () => newGame();
$("shuffle").onchange = () => newGame();

document.addEventListener("keydown", e => {
  if (!S || S.i >= S.deck.length) return;
  if (e.key !== "Enter") return;
  const typing = e.target.tagName === "TEXTAREA";
  if (!S.graded && (e.ctrlKey || e.metaKey || !typing)) { e.preventDefault(); check(); }
  else if (S.graded && e.target.id !== "next" && e.target.id !== "accept") { e.preventDefault(); next(); }
});

window.claude?.hot?.snapshot?.(() => ({ S }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
